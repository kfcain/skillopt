_base_: ../_base_/default.yaml

model:
  reasoning_effort: medium

train:
  train_size: 0          # 0 = derive from the train split
  batch_size: 8
  accumulation: 1
  num_epochs: 4

gradient:
  minibatch_size: 8
  merge_batch_size: 8

optimizer:
  learning_rate: 4

evaluation:
  sel_env_num: 0
  test_env_num: 0

env:
  name: iacpolicy
  skill_init: skillopt/envs/iacpolicy/skills/initial.md
  split_mode: split_dir
  split_dir: data/iacpolicy_split
  data_path: ""
  split_output_dir: ""
  max_completion_tokens: 4096
  workers: 8
  exec_timeout: 120
  limit: 0
